name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Qt tests run on the offscreen platform plugin (no display needed)
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tk (legacy widget tests) needs a display; this provides a virtual one on Linux
      - uses: pyvista/setup-headless-display-action@v3

      # Shared libraries PySide6 links against, even on the offscreen platform
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[test]"
      - run: python -m pytest -ra
