[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paratext"
dynamic = ["version"]
description = "Expandable, audience-aware context for technical text and scientific papers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ben Rich", email = "benjamin.rich@colorado.edu" }]

# tkinter (stdlib) is also required; some Linux distros package it separately (python3-tk).
dependencies = [
    "pymupdf>=1.24",
    "PySide6-Essentials>=6.6",
    "tomli-w>=1.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.3"]
test = ["pytest>=8.2.2", "pytest-qt>=4.4"]
dev = ["paratext[anthropic,test]", "pre-commit>=3.7.1", "ruff>=0.4.9"]

[project.scripts]
paratext = "paratext.cli:main"

[tool.setuptools.dynamic]
version = { attr = "paratext.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# PyMuPDF's SWIG bindings warn on import under Python 3.12+
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 120
output-format = "concise"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP038 (isinstance with X | Y) is deprecated in newer ruff and slower at runtime
ignore = ["UP038"]

[tool.ruff.format]
docstring-code-format = true
